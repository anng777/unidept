<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(titulo)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${titulo} + ' · UniDept'">UniDept</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>

<nav th:fragment="nav" class="navbar navbar-expand-lg navbar-dark unidept-nav sticky-top"
     th:attr="data-auth=${yo != null},data-url=@{/api/notificaciones}">
  <div class="container">
    <a class="navbar-brand fw-bold" th:href="@{/}"><i class="fa-solid fa-house-chimney-window me-2"></i>UniDept</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="menuNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" th:href="@{/alojamientos}">Buscar alojamiento</a></li>
        <li class="nav-item" th:if="${yo != null and yo.tipoUsuario.name() == 'ARRENDADOR'}">
          <a class="nav-link" th:href="@{/mis-alojamientos}">Mis alojamientos
            <span id="badge-sol" class="badge rounded-pill bg-danger d-none">0</span></a></li>
        <li class="nav-item" th:if="${yo != null and yo.tipoUsuario.name() == 'ARRENDADOR'}">
          <a class="nav-link" th:href="@{/alojamientos/nuevo}">Publicar</a></li>
        <li class="nav-item" th:if="${yo != null and yo.tipoUsuario.name() == 'ESTUDIANTE'}">
          <a class="nav-link" th:href="@{/mis-solicitudes}">Mis solicitudes
            <span id="badge-msg" class="badge rounded-pill bg-danger d-none">0</span></a></li>
        <li class="nav-item" th:if="${yo != null and yo.tipoUsuario.name() == 'ADMINISTRADOR'}">
          <a class="nav-link" th:href="@{/admin}">Panel de administración</a></li>
      </ul>
      <div class="d-flex align-items-center gap-2" th:if="${yo == null}">
        <a class="btn btn-outline-light btn-sm" th:href="@{/login}">Iniciar sesión</a>
        <a class="btn btn-light btn-sm" th:href="@{/registro}">Registrarse</a>
      </div>
      <div class="d-flex align-items-center gap-2" th:if="${yo != null}">
        <a class="text-white text-decoration-none small" th:href="@{/perfil}">
          <i class="fa-solid fa-circle-user me-1"></i><span th:text="${yo.nombreUsuario}">usuario</span>
          <i class="fa-solid fa-circle-check text-info ms-1" th:if="${yo.verificado}" title="Verificado"></i></a>
        <form th:action="@{/logout}" method="post" class="m-0">
          <button class="btn btn-outline-light btn-sm" type="submit">Salir</button>
        </form>
      </div>
    </div>
  </div>
</nav>

<div th:fragment="flash" class="container mt-3">
  <div class="alert alert-success alert-dismissible fade show" th:if="${ok}" role="alert">
    <span th:text="${ok}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
  <div class="alert alert-danger alert-dismissible fade show" th:if="${error}" role="alert">
    <span th:text="${error}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
</div>

<footer th:fragment="foot" class="py-4 mt-5 text-center text-muted small">
  <div>UniDept · Alojamiento seguro para estudiantes universitarios de Lima</div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/bootstrap.bundle.min.js"></script>
  <script th:inline="javascript">window.UNI_BASE = /*[[@{/}]]*/ '/';</script>
  <script th:src="@{/js/app.js}"></script>
</footer>

<!-- Texto de distancia: solo habla de "a pie" cuando realmente es caminable -->
<span th:fragment="distancia(a)" th:if="${a.distanciaMetros != null}">
  <i class="fa-solid fa-person-walking me-1"></i>
  <span th:text="${a.distanciaMetros lt 1000 ? #numbers.formatInteger(a.distanciaMetros,1) + ' m' : #numbers.formatDecimal(a.distanciaMetros / 1000,1,1,'POINT') + ' km'}"></span>
  <span th:if="${a.tiempoMinutos le 30}" th:text="'· ≈ ' + ${a.tiempoMinutos} + ' min a pie'"></span>
  <span th:unless="${a.tiempoMinutos le 30}">· lejos para ir a pie</span>
  <span class="text-muted">de <span th:text="${a.universidadReferencia}"></span></span>
</span>

<span th:fragment="estado(a)">
  <span class="badge badge-estado ocupado" th:if="${a.ocupadoAhora}"><i class="fa-solid fa-circle me-1"></i>Ocupado</span>
  <span class="badge badge-estado libre" th:unless="${a.ocupadoAhora}"><i class="fa-solid fa-circle me-1"></i>Disponible</span>
</span>
</body>
</html>
