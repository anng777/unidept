<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Tarjeta única: la usan el buscador y el inicio, así todas se ven igual -->
<div th:fragment="tarjeta(a, uniSel)" class="h-100">
      <div class="card h-100 shadow-sm card-alojamiento">
        <div class="position-relative">
          <img th:src="${a.imagenPrincipal}" class="card-img-top card-foto" th:alt="${a.titulo}">
          <div class="position-absolute top-0 start-0 m-2"><span th:replace="~{fragments/layout :: estado(${a})}"></span></div>
        </div>
        <div class="card-body d-flex flex-column">
          <h5 class="card-title titulo-2l" th:text="${a.titulo}">Título</h5>
          <div class="text-muted small mb-2"><i class="fa-solid fa-location-dot me-1"></i><span th:text="${a.distrito}"></span>
            · <span th:text="${a.tipo.name() == 'DEPARTAMENTO' ? 'Departamento' : 'Habitación'}"></span></div>
          <div class="fw-bold fs-5 text-primary mb-1">S/ <span th:text="${#numbers.formatDecimal(a.precioMensual,1,'COMMA',0,'POINT')}">0</span><small class="text-muted fw-normal"> /mes</small></div>
          <div class="small mb-2 fila-distancia">
            <span th:replace="~{fragments/layout :: distancia(${a})}"></span>
            <span class="text-muted" th:if="${a.distanciaMetros == null}">Elige una universidad para ver la distancia</span>
          </div>
          <div class="fila-etiquetas mb-3">
            <span class="badge text-bg-light border" th:if="${a.admiteRoommates}"><i class="fa-solid fa-user-group me-1"></i>Roommates</span>
            <span class="badge text-bg-light border" th:if="${a.admiteMascotas}"><i class="fa-solid fa-paw me-1"></i>Mascotas</span>
            <span class="badge text-bg-light border" th:if="${a.wifi}"><i class="fa-solid fa-wifi me-1"></i>WiFi</span>
            <span class="badge text-bg-light border" th:if="${a.amoblado}"><i class="fa-solid fa-couch me-1"></i>Amoblado</span>
          </div>
          <a class="btn btn-primary mt-auto" th:href="@{/alojamientos/{id}(id=${a.idAlojamiento},uni=${uniSel})}">Ver detalle</a>
        </div>
      </div>

</div>
</body>
</html>
