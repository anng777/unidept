# ===== UniDept - configuración =====
server.port=8080
server.servlet.context-path=/unidept
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# ----- Base de datos (cambia usuario/clave por los de tu MySQL) -----
spring.datasource.url=jdbc:mysql://localhost:3306/unidept?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=

# ----- JPA: el esquema lo crea database/schema.sql, Hibernate NO lo modifica -----
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima
spring.jpa.show-sql=false

# ----- Thymeleaf -----
spring.thymeleaf.cache=false

# ----- JWT -----
# Cambia el secreto (mínimo 32 caracteres) o defínelo con la variable de entorno JWT_SECRET
unidept.jwt.secret=${JWT_SECRET:cambia-este-secreto-por-uno-largo-y-aleatorio-de-32+caracteres}
unidept.jwt.expiracion-horas=8
unidept.jwt.cookie=UNIDEPT_JWT

# ----- APIs externas (variables de entorno, ver README) -----
reniec.token=${RENIEC_API_TOKEN:}
google.maps.key=${GOOGLE_MAPS_API_KEY:}

# Diagnóstico de 403: muestra en consola por qué Spring Security deniega una petición
logging.level.org.springframework.security.web.access=DEBUG
logging.level.com.unihousing.security=DEBUG
